name: Build macOS DMG

on:
  workflow_dispatch:          # 手动触发（仓库页 Actions → Run workflow）
  push:
    branches: [ main ]        # 推送 main 自动构建

# 新推送自动取消旧的排队 / 运行中构建，避免占着队列
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13   # Intel (x64)
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # 编译目标仍是 Java 8（pom 的 java.version=1.8）；
      # 用 JDK 17 编译是为了兼容 macOS 运行器（mac arm64 没有官方 JDK 8）
      - name: Setup Java 17 (compile target 1.8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend jar
        run: |
          mvn -f server/pom.xml -q -DskipTests package
          mkdir -p dist-resources/backend
          cp server/target/ktv-server-0.1.0.jar dist-resources/backend/ktv-server.jar

      - name: Prepare JRE (copy installed JDK)
        run: bash scripts/prepare-mac.sh jre

      - name: Prepare ffmpeg / ffprobe
        run: bash scripts/prepare-mac.sh ffmpeg

      - name: Build whisper-cli (static)
        run: bash scripts/prepare-mac.sh whisper

      # 精简 JRE（jlink）冒烟测试：真正拉起后端并请求接口，防止缺模块到客户机上才发现
      - name: Smoke test (slim JRE boots backend)
        run: |
          set -e
          JRE="$PWD/dist-resources/backend/jre/bin/java"
          mkdir -p "$RUNNER_TEMP/ktv-smoke"
          "$JRE" -jar "$PWD/dist-resources/backend/ktv-server.jar" \
            --server.address=127.0.0.1 --server.port=8799 \
            --ktv.data-dir="$RUNNER_TEMP/ktv-smoke/data" \
            --ktv.bin-dir="$PWD/dist-resources/bin" \
            --ktv.models-dir="$RUNNER_TEMP/ktv-smoke/models" \
            > "$RUNNER_TEMP/ktv-smoke/server.log" 2>&1 &
          SERVER_PID=$!
          ok=""
          for i in $(seq 1 45); do
            sleep 2
            if curl -sf -m 3 http://127.0.0.1:8799/api/system/tools > /dev/null; then ok=1; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
          done
          kill $SERVER_PID 2>/dev/null || true
          if [ -z "$ok" ]; then
            echo "!! 精简 JRE 启动后端失败，日志尾部："
            tail -80 "$RUNNER_TEMP/ktv-smoke/server.log" || true
            exit 1
          fi
          echo "== 冒烟测试通过：精简 JRE 可启动后端并响应 /api/system/tools =="

      # 模型不进安装包：应用首次使用时由客户端下载（见 desktop/main.js）

      - name: Build DMG
        working-directory: desktop
        run: |
          npm i || (echo "npm i 失败，重试 …" && sleep 5 && npm i)
          # 只构建本矩阵架构：package.json 不再固定 arch 列表，避免 dist/ 里出现两个 dmg 被一起上传
          npx electron-builder --mac --${{ matrix.arch }}

      - name: Size report
        run: |
          echo "== dist/ 产物清单 =="
          ls -lh dist/ || true
          echo "== 内置资源体积（打包前） =="
          du -sh dist-resources/backend dist-resources/bin 2>/dev/null || true
          du -sh dist-resources/backend/jre dist-resources/backend/ktv-server.jar 2>/dev/null || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KFC-Music-${{ matrix.arch }}-dmg
          path: dist/*-${{ matrix.arch }}.dmg
          if-no-files-found: error
