name: Build macOS DMG

on:
  workflow_dispatch:          # 手动触发（仓库页 Actions → Run workflow）
  push:
    branches: [ main ]        # 推送 main 自动构建

# 新推送自动取消旧的排队 / 运行中构建，避免占着队列
concurrency:
  group: build-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13   # Intel (x64)
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # 编译目标仍是 Java 8（pom 的 java.version=1.8）；
      # 用 JDK 17 编译是为了兼容 macOS 运行器（mac arm64 没有官方 JDK 8）
      - name: Setup Java 17 (compile target 1.8)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend jar
        run: |
          mvn -f server/pom.xml -q -DskipTests package
          mkdir -p dist-resources/backend
          cp server/target/ktv-server-0.1.0.jar dist-resources/backend/ktv-server.jar

      - name: Prepare JRE 17
        run: bash scripts/prepare-mac.sh jre

      - name: Prepare ffmpeg + whisper-cli
        run: bash scripts/prepare-mac.sh tools

      - name: Download whisper model (1.5GB)
        run: bash scripts/prepare-mac.sh model

      - name: Build DMG
        working-directory: desktop
        run: |
          npm i
          npx electron-builder --mac --${{ matrix.arch }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KFC-Music-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
