name: Build macOS DMG

on:
  workflow_dispatch:          # 手动触发（仓库页 Actions → Run workflow）
  push:
    branches: [ main ]        # 推送 main 自动构建

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-13   # Intel (x64)
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend jar
        run: mvn -f server/pom.xml -q -DskipTests package

      - name: Prepare macOS resources (JRE / ffmpeg / whisper / model)
        run: |
          mkdir -p dist-resources/backend dist-resources/bin/models
          cp server/target/ktv-server-0.1.0.jar dist-resources/backend/ktv-server.jar
          bash scripts/prepare-mac.sh deps

      - name: Build DMG
        working-directory: desktop
        run: |
          npm i
          npx electron-builder --mac --${{ matrix.arch }}

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KTV-Maker-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
